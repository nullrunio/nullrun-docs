      - 2.2. Budgets: concepts/budgets.md
      - 2.3. Sensitive tools: concepts/sensitive-tools.md
      - 2.4. Workflow context: concepts/workflow.md
      - 2.5. Tracing: concepts/tracing.md
      - 2.6. Control plane (WebSocket): concepts/control-plane.md
      - 2.7. API keys: concepts/api-keys.md
      - 2.8. Policies: concepts/policies.md
      - 2.9. Tool policies: concepts/tool-policies.md
      - 2.10. Human approval: concepts/human-approval.md
      - 2.11. Error handling: concepts/error-handling.md
  - 3. How-to:
      - 3.1. Protect a LangGraph agent: how-to/langgraph.md
      - 3.2. Use with OpenAI Agents: how-to/openai-agents.md
      - 3.3. Use CrewAI: how-to/crewai.md
      - 3.4. Use with FastAPI: how-to/fastapi.md
      - 3.5. LLM frameworks: how-to/llm-frameworks.md
      - 3.6. Set a hard cost cap: how-to/cost-cap.md
      - 3.7. Run multiple agents: how-to/multi-agent.md
